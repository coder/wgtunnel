name: release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      snapshot:
        description: Force a dev version to be generated, implies dry_run.
        type: boolean
        required: true
      dry_run:
        description: Perform a dry-run release.
        type: boolean
        required: true

permissions:
  # Required to publish a release
  contents: write
  # Necessary to push docker images to ghcr.io.
  packages: write

env:
  WGTUNNEL_RELEASE: ${{ github.event.inputs.snapshot && 'false' || 'true' }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # If the event that triggered the build was an annotated tag (which our
      # tags are supposed to be), actions/checkout has a bug where the tag in
      # question is only a lightweight tag and not a full annotated tag. This
      # command seems to fix it.
      # https://github.com/actions/checkout/issues/290
      - name: Fetch git tags
        run: git fetch --tags --force

      - name: Docker Login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "~1.23"
          cache: false

      - name: Build tunneld and Docker images
        id: build
        run: |
          set -euo pipefail
          go mod download

          make clean
          make -j build/tunneld build/tunneld.tag

          image_tag=$(cat build/tunneld.tag)
          if [[ "$image_tag" == "" ]]; then
            echo "No tag found in build/tunneld.tag"
            exit 1
          fi

          echo "docker_tag=${image_tag}" >> "$GITHUB_OUTPUT"

      - name: Push Docker image
        if: ${{ !github.event.inputs.dry_run && !github.event.inputs.snapshot }}
        env:
          DOCKER_TAG: ${{ steps.build.outputs.docker_tag }}
        run: |
          set -euxo pipefail

          image_tag="$DOCKER_TAG"
          docker push "$image_tag"

          latest_tag="ghcr.io/coder/wgtunnel/tunneld:latest"
          docker tag "$image_tag" "$latest_tag"
          docker push "$latest_tag"

      - name: ls build
        run: ls -lh build

      - name: Publish release
        if: ${{ !github.event.inputs.dry_run && !github.event.inputs.snapshot }}
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          artifacts: "build/tunneld"
          body: "Docker image: `${{ steps.build.outputs.docker_tag }}`"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts to actions (if dry-run or snapshot)
        if: ${{ github.event.inputs.dry_run || github.event.inputs.snapshot }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            ./build/tunneld
          retention-days: 7
